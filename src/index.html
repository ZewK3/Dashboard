<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Đặt hàng tại TocoToco - Trà sữa và đồ uống yêu thích của bạn với giao hàng nhanh chóng!">
  <title>TocoToco - Đặt hàng Online</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <button class="menu-toggle" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </button>
    
    <div class="logo">
      <img src="assets/images/logo.png" alt="TocoToco Logo" class="logo-img">
      <h1>TocoToco</h1>
    </div>

    <div class="user-info" id="user-info" style="display: none;">
      <div class="user-details">
        <div class="user-name">
          <span id="user-name-display"></span>
          <div class="rank-icon" id="rank-icon"></div>
        </div>
        <div class="points-exp">
          <div class="points" id="user-points">0 Points</div>
          <div class="exp-bar">
            <div class="exp-fill" id="exp-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <div id="auth-control">
        <button onclick="showLoginPopup(false)" id="login-button" class="btn btn-outline">
          <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </button>
        <button onclick="showLoginPopup(true)" id="register-button" class="btn btn-primary">
          <i class="fas fa-user-plus"></i> Đăng ký
        </button>
        <button onclick="logout()" id="logout-button" class="btn btn-outline" style="display: none;">
          <i class="fas fa-sign-out-alt"></i> Đăng xuất
        </button>
      </div>
      
      <button class="cart-btn" onclick="viewCart()">
        <i class="fas fa-shopping-cart"></i>
        <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3><i class="fas fa-list"></i> Danh Mục</h3>
      </div>
      <nav class="category-nav">
        <ul id="category-list"></ul>
      </nav>
      
      <div class="sidebar-footer">
        <div class="quick-actions">
          <button class="btn btn-secondary" onclick="viewCart()">
            <i class="fas fa-shopping-cart"></i>
            Giỏ hàng (<span id="cart-count-sidebar">0</span>)
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="content-header">
        <h2 id="category-title">Trà Sữa</h2>
        <div class="content-actions">
          <div class="search-bar">
            <input type="text" id="product-search" placeholder="Tìm kiếm sản phẩm...">
            <i class="fas fa-search"></i>
          </div>
          <div class="view-toggle">
            <button class="btn btn-sm" onclick="toggleView('grid')" id="grid-view">
              <i class="fas fa-th"></i>
            </button>
            <button class="btn btn-sm" onclick="toggleView('list')" id="list-view">
              <i class="fas fa-list"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="product-list" id="product-list"></div>
      
      <div class="loading" id="loading" style="display: none;">
        <div class="spinner"></div>
        <p>Đang tải...</p>
      </div>
    </main>
  </div>

  <!-- Popups and Modals -->
  <div id="popup-container"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  
  <script src="js/config.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/notifications.js"></script>
  <script src="js/utils/api.js"></script>
  <script src="js/components/modals.js"></script>
  <script src="js/components/cart.js"></script>
  <script src="js/components/products.js"></script>
  <script src="js/components/auth.js"></script>
  <script src="js/components/map.js"></script>
  <script src="js/components/payment.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
