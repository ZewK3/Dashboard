<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TocoToco Store - Quản lý đơn hàng</title>
  <link rel="icon" href="../favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/store.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">
            <i class="fas fa-store"></i>
            <h1>TocoToco Store</h1>
          </div>
          <p>Đăng nhập để quản lý đơn hàng</p>
        </div>
        
        <form id="store-login-form" class="login-form">
          <div class="form-group">
            <label for="store-code">Mã cửa hàng</label>
            <div class="input-group">
              <i class="fas fa-store"></i>
              <input type="text" id="store-code" name="store-code" placeholder="Nhập mã cửa hàng" required>
            </div>
          </div>
          
          <div class="form-group">
            <label for="store-password">Mật khẩu</label>
            <div class="input-group">
              <i class="fas fa-lock"></i>
              <input type="password" id="store-password" name="store-password" placeholder="Nhập mật khẩu" required>
              <button type="button" class="toggle-password" onclick="togglePassword()">
                <i class="fas fa-eye" id="eye-icon"></i>
              </button>
            </div>
          </div>
          
          <button type="submit" class="login-btn">
            <i class="fas fa-sign-in-alt"></i>
            Đăng nhập
          </button>
        </form>
        
        <div class="login-footer">
          <p>Liên hệ quản trị viên nếu bạn cần hỗ trợ</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="main-app" class="main-app" style="display: none;">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="store-info">
          <i class="fas fa-store"></i>
          <div class="store-details">
            <h2 id="store-name">Cửa hàng</h2>
            <span id="store-location">Địa chỉ</span>
          </div>
        </div>
      </div>
      
      <div class="header-center">
        <div class="quick-stats">
          <div class="stat-item">
            <i class="fas fa-clock"></i>
            <div class="stat-info">
              <span class="stat-value" id="pending-orders">0</span>
              <span class="stat-label">Chờ xử lý</span>
            </div>
          </div>
          <div class="stat-item">
            <i class="fas fa-check-circle"></i>
            <div class="stat-info">
              <span class="stat-value" id="completed-today">0</span>
              <span class="stat-label">Hoàn thành hôm nay</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="header-right">
        <button class="notification-btn" onclick="toggleNotifications()">
          <i class="fas fa-bell"></i>
          <span class="notification-badge" id="notification-count">0</span>
        </button>
        <button class="refresh-btn" onclick="refreshOrders()">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Đăng xuất</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Filters and Search -->
      <div class="content-header">
        <div class="filters">
          <div class="filter-group">
            <label>Trạng thái:</label>
            <select id="status-filter" onchange="filterOrders()">
              <option value="">Tất cả</option>
              <option value="pending" selected>Chờ xác nhận</option>
              <option value="confirmed">Đã xác nhận</option>
              <option value="preparing">Đang chuẩn bị</option>
              <option value="ready">Sẵn sàng</option>
              <option value="delivering">Đang giao</option>
              <option value="completed">Hoàn thành</option>
              <option value="cancelled">Đã hủy</option>
            </select>
          </div>
          
          <div class="filter-group">
            <label>Thời gian:</label>
            <select id="time-filter" onchange="filterOrders()">
              <option value="today" selected>Hôm nay</option>
              <option value="yesterday">Hôm qua</option>
              <option value="week">Tuần này</option>
              <option value="month">Tháng này</option>
              <option value="custom">Tùy chọn</option>
            </select>
          </div>
          
          <div class="search-group">
            <div class="search-input">
              <i class="fas fa-search"></i>
              <input type="text" id="order-search" placeholder="Tìm mã đơn, khách hàng..." onchange="filterOrders()">
            </div>
          </div>
        </div>
        
        <div class="actions">
          <button class="btn btn-primary" onclick="exportOrders()">
            <i class="fas fa-download"></i>
            Xuất báo cáo
          </button>
        </div>
      </div>

      <!-- Orders List -->
      <div class="orders-container">
        <div class="orders-header">
          <h3>Danh sách đơn hàng</h3>
          <div class="sort-options">
            <select id="sort-options" onchange="sortOrders()">
              <option value="newest">Mới nhất</option>
              <option value="oldest">Cũ nhất</option>
              <option value="priority">Ưu tiên</option>
              <option value="amount">Giá trị đơn</option>
            </select>
          </div>
        </div>
        
        <div class="orders-list" id="orders-list">
          <!-- Orders will be populated here -->
        </div>
        
        <div class="empty-state" id="empty-state" style="display: none;">
          <i class="fas fa-inbox"></i>
          <h3>Không có đơn hàng</h3>
          <p>Chưa có đơn hàng nào trong khoảng thời gian này</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Order Detail Modal -->
  <div id="order-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Chi tiết đơn hàng</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Order details will be populated here -->
      </div>
    </div>
  </div>

  <!-- Notification Panel -->
  <div id="notification-panel" class="notification-panel">
    <div class="notification-header">
      <h3>Thông báo</h3>
      <button class="close-btn" onclick="toggleNotifications()">&times;</button>
    </div>
    <div class="notification-list" id="notification-list">
      <!-- Notifications will be populated here -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="../src/js/config.js"></script>
  <script src="js/store-auth.js"></script>
  <script src="js/store-orders.js"></script>
  <script src="js/store-notifications.js"></script>
  <script src="js/store-app.js"></script>
</body>
</html>
